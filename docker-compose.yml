# Local backend + PostgreSQL:   docker compose up --build
# API at http://localhost:8000/docs   (run the frontend separately with npm run dev)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: foodverse
      POSTGRES_PASSWORD: foodverse
      POSTGRES_DB: foodverse
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodverse"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://foodverse:foodverse@db:5432/foodverse
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
