# Render Blueprint: backend API + PostgreSQL.  (Frontend goes on Vercel/Netlify, see README.)
databases:
  - name: foodverse-db
    plan: free
services:
  - type: web
    name: foodverse-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: foodverse-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false   # set to your frontend URL after deploying it, e.g. https://foodverse.vercel.app
